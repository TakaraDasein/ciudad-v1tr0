# NVIDIA GPU configuration for Wayland/Hyprland (Intel iGPU + NVIDIA dGPU via PRIME)
#
# Source: https://wiki.hyprland.org/Nvidia/ (updated 2026-06-11)
#
# Force Intel VA-API driver for hardware video decode.
# libva-nvidia-driver is installed but Chromium-based browsers (Brave) fail with it
# (documented as "experimental, not much success" in official Hyprland wiki).
# Intel iHD driver handles video decode correctly since Intel drives the display.
env = LIBVA_DRIVER_NAME,iHD

# NOTE: PRIME render offload vars (__NV_PRIME_RENDER_OFFLOAD, __GLX_VENDOR_LIBRARY_NAME,
# __VK_LAYER_NV_optimus, VK_ICD_FILENAMES) are intentionally NOT set here.
# Setting them globally breaks hyprlock, waybar and other Wayland system tools on
# hybrid graphics laptops. Use `prime-run <app>` per-application for games.
