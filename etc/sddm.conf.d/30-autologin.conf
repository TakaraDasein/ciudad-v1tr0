# Omarchy habilita el autologin cuando el disco raiz esta cifrado: la
# passphrase de LUKS que escribes en Plymouth al arrancar ya es la frontera de
# seguridad, y pedir una segunda contrasena en SDDM seria preguntarle lo mismo
# a la misma persona. Ver should_enable_sddm_autologin() en
# bin/omarchy-upgrade-to-quattro. La sesion encendida la protege hyprlock.
[Autologin]
User=efren-cyborg
Session=omarchy
